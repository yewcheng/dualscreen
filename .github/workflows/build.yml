name: Build DualScreen

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Select newest installed Xcode
        run: |
          set -euo pipefail
          XC=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XC"
          sudo xcode-select -s "$XC"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      # --- Smoke test: does it actually launch and draw the controller scene? ---

      - name: Build for iPad simulator
        run: |
          xcodebuild \
            -project DualScreen.xcodeproj \
            -scheme DualScreen \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPad (10th generation)' \
            -derivedDataPath build-sim \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Launch on simulator and screenshot
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl create ci-ipad \
            "com.apple.CoreSimulator.SimDeviceType.iPad-10th-generation" \
            "$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print([r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["platform"]=="iOS" and r["isAvailable"]][-1])')")
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          APP=build-sim/Build/Products/Debug-iphonesimulator/DualScreen.app
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.dualscreen.workspace
          sleep 8
          xcrun simctl io "$UDID" screenshot controller-scene.png
          # A crash on launch leaves no process; fail loudly if so.
          xcrun simctl spawn "$UDID" launchctl list | grep -q com.dualscreen.workspace \
            || { echo "::error::app is not running after launch"; exit 1; }

      - name: Upload simulator screenshot
        uses: actions/upload-artifact@v4
        with:
          name: controller-scene-screenshot
          path: controller-scene.png

      # --- Device build: unsigned .ipa for sideloading from Windows ---

      - name: Build unsigned for device
        run: |
          xcodebuild \
            -project DualScreen.xcodeproj \
            -scheme DualScreen \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build-device \
            MARKETING_VERSION=0.3.${{ github.run_number }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package .ipa
        run: |
          set -euo pipefail
          mkdir -p out/Payload
          cp -R build-device/Build/Products/Release-iphoneos/DualScreen.app out/Payload/
          cd out
          zip -qry DualScreen-unsigned.ipa Payload
          ls -lh DualScreen-unsigned.ipa

      - name: Verify the built version matches what the source will advertise
        run: |
          set -euo pipefail
          EXPECTED="0.3.${{ github.run_number }}"
          PLIST=out/Payload/DualScreen.app/Info.plist
          ACTUAL=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST")
          echo "Info.plist says $ACTUAL, source will advertise $EXPECTED"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::version mismatch — SideStore would reject this download"
            exit 1
          fi

      - name: Upload .ipa
        uses: actions/upload-artifact@v4
        with:
          name: DualScreen-unsigned-ipa
          path: out/DualScreen-unsigned.ipa
          retention-days: 30

      # --- Over-the-air: publish a release and a SideStore source so the iPad
      #     can install and update itself with no computer in the loop ---

      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="0.3.${{ github.run_number }}"
          gh release create "v$VERSION" out/DualScreen-unsigned.ipa \
            --title "DualScreen $VERSION" \
            --notes "Automated build of ${{ github.sha }}. Unsigned — SideStore signs it on install."

      - name: Update SideStore source
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          VERSION="0.3.${{ github.run_number }}"
          SIZE=$(stat -f%z out/DualScreen-unsigned.ipa)
          URL="https://github.com/${{ github.repository }}/releases/download/v$VERSION/DualScreen-unsigned.ipa"
          python3 scripts/make_source.py "$VERSION" "$SIZE" "$(date -u +%Y-%m-%d)" "$URL" > source.json

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add source.json
          git diff --cached --quiet && exit 0
          git commit -m "Publish $VERSION to the SideStore source [skip ci]"
          git push
