name: DualScreen
options:
  bundleIdPrefix: com.dualscreen
  # Xcode 15 on the CI runner cannot read XcodeGen's newest pbxproj format.
  objectVersion: 54
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "2"          # iPad only
    DEVELOPMENT_TEAM: ""                  # left empty: CI builds unsigned
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  DualScreen:
    type: application
    platform: iOS
    sources:
      - path: Sources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: DualScreen
        CFBundleShortVersionString: "0.3.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        # Keeps the process (and so the external scene) alive when DualScreen is
        # not frontmost. See Sources/Model/KeepAlive.swift.
        UIBackgroundModes:
          - audio
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Controller
                UISceneDelegateClassName: ControllerSceneDelegate
            UIWindowSceneSessionRoleExternalDisplayNonInteractive:
              - UISceneConfigurationName: External
                UISceneDelegateClassName: ExternalSceneDelegate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dualscreen.workspace
        MARKETING_VERSION: "0.3.0"
